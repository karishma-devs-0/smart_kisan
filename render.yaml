# Render Blueprint for the SmartKisan API.
#
# The Express backend lives in backend/ inside this repo, hence rootDir.
# Database is Neon Postgres (ap-southeast-1), managed outside Render — so no
# Render database is declared here.
#
# Secrets use `sync: false`: Render prompts for them on first deploy and stores
# them encrypted. They are deliberately NOT in this file, which is committed.
services:
  - type: web
    name: smartkisan-api
    runtime: node
    plan: free
    region: singapore # same region as the Neon DB, keeps query latency low
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_SSL
        value: "true" # Neon requires SSL
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: neondb
      - key: AI_TICK_SECONDS
        value: "900"
      - key: GOOGLE_WEB_CLIENT_ID
        value: 782177553731-bhnqmugdoekfsg421kraclnjpab96n6q.apps.googleusercontent.com
      # ── Secrets — set these in the Render dashboard, not here ──
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MQTT_BROKER_URL
        sync: false
      - key: MQTT_USERNAME
        sync: false
      - key: MQTT_PASSWORD
        sync: false
